<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Julianne Edes</title>
<meta name="description" content="Julianne Edes — Product &amp; Project Manager">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%2316161a'/%3E%3Ctext%20x='16'%20y='23'%20font-family='monospace'%20font-size='17'%20font-weight='700'%20fill='%23d2601a'%20text-anchor='middle'%3Eje%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="room">

  <div class="board-frame">
    <div class="board" id="board" aria-label="julianne's bulletin board">
      <!-- items are rendered here -->
    </div>
  </div>

  <div class="toolbar">
    <button type="button" class="tool" id="add-note">
      <span class="tool-glyph" aria-hidden="true">✎</span> add note
    </button>
    <button type="button" class="tool" id="add-photo">
      <span class="tool-glyph" aria-hidden="true">▣</span> add photo
    </button>
    <span class="tool-hint">drag things around &middot; click to look closer</span>
  </div>

</div>

<!-- the note composer, shown over the board -->
<div class="compose-layer" id="compose-layer" hidden>
  <div class="compose" role="dialog" aria-modal="true" aria-labelledby="compose-title">
    <h2 class="compose-title" id="compose-title">pin a note</h2>
    <textarea
      id="compose-text"
      class="compose-text"
      maxlength="180"
      rows="4"
      placeholder="say hi, leave a recommendation, anything"
      spellcheck="false"></textarea>
    <div class="compose-row">
      <span class="swatches" id="swatches" role="radiogroup" aria-label="note colour"></span>
      <span class="compose-count"><span id="compose-left">180</span> left</span>
    </div>
    <div class="compose-actions">
      <button type="button" class="ghost" id="compose-cancel">cancel</button>
      <button type="button" class="solid" id="compose-pin">pin it</button>
    </div>
  </div>
</div>

<!-- backdrop for the zoomed-in view -->
<div class="zoom-backdrop" id="zoom-backdrop" hidden></div>
<button type="button" class="zoom-close" id="zoom-close" hidden aria-label="close">esc</button>

<input type="file" id="file-input" accept="image/*" hidden>

<script src="firebase-config.js"></script>
<script src="script.js"></script>
</body>
</html>
